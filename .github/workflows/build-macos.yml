# Builds the macOS app (universal: Apple silicon + Intel) on GitHub's Mac machines.
# Put this project in a GitHub repository with the app folder as its root, then run it from the
# Actions tab ("Run workflow") or by pushing a tag like v1.8.0. The .dmg appears under the run's Artifacts.
name: Build macOS

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build universal app and disk image
        run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MyCCTV-macos
          path: release/MyCCTV-*-macos-universal.dmg
