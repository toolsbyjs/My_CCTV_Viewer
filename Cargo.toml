[package]
name = "mycctv"
version = "1.10.0"
edition = "2021"
description = "MyCCTV - a camera and recorder viewer for Windows, Android and Google TV"
default-run = "mycctv"

[lib]
name = "mycctv_core"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "mycctv"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = { version = "0.29", features = ["bytemuck"] }
# Hands video pictures to the screen without copying them (see app.rs pump_windows).
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
retina = "0.4"
tokio = { version = "1", features = ["rt", "time", "macros", "net", "sync"] }
futures = "0.3"
url = "2"
openh264 = "0.9"
rusty_h265 = "0.7"
md-5 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
socket2 = { version = "0.5", features = ["all"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
android_logger = "0.14"
winit = { version = "0.30", features = ["android-native-activity"] }
jni = "0.21"

[target.'cfg(not(target_os = "android"))'.dependencies]
if-addrs = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[dev-dependencies]
# Writes the macOS app icon (assets/app.icns) in the icon generator test.
icns = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[package.metadata.android]
package = "com.mycctv.viewer"
apk_name = "MyCCTV"
# arm64 phones and TVs, plus 32-bit Android TV boxes (many Google TV devices run 32-bit Android).
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]
resources = "res"

# Local signing key so the package installs; replace with your own Play Store key before publishing.
[package.metadata.android.signing.release]
path = "keys/release.keystore"
keystore_password = "mycctv-store"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 33

[[package.metadata.android.uses_feature]]
name = "android.software.leanback"
required = false

[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = false

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[package.metadata.android.application]
label = "MyCCTV"
icon = "@mipmap/ic_launcher"
debuggable = false

[package.metadata.android.application.activity]
orientation = "unspecified"
config_changes = "orientation|screenSize|keyboardHidden|keyboard|navigation|uiMode"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER", "android.intent.category.LEANBACK_LAUNCHER"]
